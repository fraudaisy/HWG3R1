<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英文單字朗讀＋測驗</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;margin:0;background:#f2f5f9;color:#222}
header{background:#2b7cd3;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px}
label{font-weight:700;display:block;margin-bottom:8px}
input[type=text]{width:100%;font-size:18px;padding:12px;border:2px solid #ccc;border-radius:10px}
.btn{display:block;width:100%;font-size:19px;font-weight:700;padding:15px;margin:10px 0;border:none;border-radius:12px;background:#2b7cd3;color:#fff;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.green{background:#28a745}.btn.orange{background:#ef6c00}.btn.purple{background:#7b1fa2}.btn.gray{background:#607d8b}.btn.small{font-size:16px;padding:10px}
.row{display:flex;gap:8px}.row .btn{margin:6px 0}
.word-item{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:18px;cursor:pointer}
.word-item small{color:#666}
.word-en{font-size:26px;font-weight:800;color:#1a56a8}
.word-zh{font-size:18px;color:#333}
.sentence{font-size:16px;color:#444;background:#f6f9ff;border-radius:8px;padding:10px;margin-top:10px}
.status{font-size:15px;margin-top:10px;min-height:22px;color:#333;white-space:pre-line}
.status.ok{color:#1b8a2e}.status.err{color:#c62828}
.hidden{display:none}
.progress{height:10px;background:#e0e0e0;border-radius:6px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:#2b7cd3;width:0%}
.opt{display:block;width:100%;text-align:left;font-size:18px;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:10px;background:#fff;cursor:pointer}
.opt.correct{border-color:#28a745;background:#e8f5e9}
.opt.wrong{border-color:#c62828;background:#ffebee}
audio{width:100%;margin-top:10px}
.topbar{display:flex;gap:8px;margin-bottom:10px}
.topbar .btn{margin:0;font-size:15px;padding:10px}
.score{font-size:26px;font-weight:800;text-align:center;color:#1a56a8}
.hint{font-size:14px;color:#666}
</style>
</head>
<body>
<header>英文單字朗讀＋測驗</header>
<div class="wrap">

<!-- 首頁 -->
<div id="page-home" class="card">
<label for="nameInput">請輸入姓名（座號＋姓名，例如：01王小明）</label>
<input type="text" id="nameInput" placeholder="請輸入姓名" autocomplete="off">
<button class="btn" onclick="goListen()">🔊 聽力練習</button>
<button class="btn orange" onclick="goRecord()">🎤 錄音作業</button>
<button class="btn green" onclick="goQuiz()">📝 單字測驗</button>
<p class="hint">※ 錄音和測驗完成後會自動上傳給老師，請確認姓名正確。<br>※ 第一次使用錄音需允許麥克風權限。</p>
<div id="homeStatus" class="status"></div>
</div>

<!-- 聽力 -->
<div id="page-listen" class="hidden">
<div class="topbar"><button class="btn gray" onclick="showPage('page-home')">← 回首頁</button></div>
<div class="card"><b>聽力練習：點一下單字就會朗讀</b><div class="hint" id="topicLabel1"></div></div>
<div id="listenList"></div>
</div>

<!-- 錄音 -->
<div id="page-record" class="hidden">
<div class="topbar"><button class="btn gray" onclick="showPage('page-home')">← 回首頁</button></div>
<div class="card">
<div class="hint" id="topicLabel2"></div>
<div class="progress"><div id="recProgress"></div></div>
<div class="word-en" id="recWord">-</div>
<div class="word-zh" id="recZh">-</div>
<div class="sentence" id="recSentence">-</div>
<div class="row">
<button class="btn gray small" onclick="speakCurrent()">🔊 朗讀</button>
<button class="btn gray small" onclick="recPrev()">← 上一個</button>
<button class="btn gray small" onclick="recNext()">下一個 →</button>
</div>
<hr>
<div class="row">
<button id="btnRecStart" class="btn orange" onclick="startRecording()">● 開始錄音</button>
<button id="btnRecStop" class="btn purple" onclick="stopRecording()" disabled>■ 停止並自動上傳</button>
</div>
<audio id="recAudio" controls class="hidden"></audio>
<div id="recStatus" class="status"></div>
</div>
</div>

<!-- 測驗 -->
<div id="page-quiz" class="hidden">
<div class="topbar"><button class="btn gray" onclick="showPage('page-home')">← 回首頁</button></div>
<div class="card" id="quizCard">
<div class="hint" id="topicLabel3"></div>
<div class="progress"><div id="quizProgress"></div></div>
<div id="quizBody"></div>
<div id="quizStatus" class="status"></div>
</div>
</div>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwJOP5PvKfRf-MjyTrlc45VGCs3hJrS-zCMI8Owgqs-4XfL1QBp8q-oYf2Jgw4DPGDK/exec";
const TOPIC = "U3 Weather and Feelings";
const REC_SHEET = "錄音上傳";
const QUIZ_SHEET = "測驗成績";
const DRIVE_FOLDER = "U3錄音作業";
// ===== 單字表（換單元只換這段 START）=====
const WORDS = [
 {en:"sunny", zh:"晴朗的", sentence:"It is sunny today."},
 {en:"rainy", zh:"下雨的", sentence:"It is rainy today."},
 {en:"cloudy", zh:"陰天的", sentence:"It is cloudy today."},
 {en:"windy", zh:"颳風的", sentence:"It is windy today."},
 {en:"hot", zh:"炎熱的", sentence:"It is hot today."},
 {en:"warm", zh:"溫暖的", sentence:"It is warm today."},
 {en:"cool", zh:"涼爽的", sentence:"It is cool today."},
 {en:"cold", zh:"寒冷的", sentence:"It is cold today."},
 {en:"weather", zh:"天氣", sentence:"How is the weather?"},
 {en:"angry", zh:"生氣的", sentence:"He is angry."},
 {en:"happy", zh:"快樂的", sentence:"She is happy."},
 {en:"sad", zh:"傷心的", sentence:"He is sad."},
 {en:"tired", zh:"疲累的", sentence:"I am tired."},
 {en:"full", zh:"飽的", sentence:"I am full."},
 {en:"hungry", zh:"肚子餓的", sentence:"I am hungry."},
 {en:"thirsty", zh:"口渴的", sentence:"I am thirsty."}
];
// ===== 單字表（換單元只換這段 END）=====

function getName(){ return document.getElementById('nameInput').value.trim(); }
function showPage(id){
 ['page-home','page-listen','page-record','page-quiz'].forEach(function(p){
   document.getElementById(p).classList.toggle('hidden', p!==id);
 });
 window.scrollTo(0,0);
}
function speak(text){
 try{ speechSynthesis.cancel(); }catch(e){}
 var u = new SpeechSynthesisUtterance(text);
 u.lang = 'en-US'; u.rate = 0.85;
 speechSynthesis.speak(u);
}
document.getElementById('topicLabel1').textContent = '主題：' + TOPIC;
document.getElementById('topicLabel2').textContent = '主題：' + TOPIC;
document.getElementById('topicLabel3').textContent = '主題：' + TOPIC;

/* ---- 聽力 ---- */
function goListen(){
 renderListen();
 showPage('page-listen');
}
function renderListen(){
 var box = document.getElementById('listenList');
 box.innerHTML = '';
 WORDS.forEach(function(w,i){
   var d = document.createElement('div');
   d.className = 'word-item';
   d.innerHTML = '<span><b>'+(i+1)+'. '+w.en+'</b> <small>'+w.zh+'</small></span><span>🔊</span>';
   d.onclick = function(){ speak(w.en); };
   box.appendChild(d);
 });
}

/* ---- 錄音 ---- */
var recIndex = 0, mediaRecorder = null, audioChunks = [], audioStream = null, isRecording = false;
function goRecord(){
 if(!getName()){ alert('請先輸入姓名'); return; }
 recIndex = 0;
 renderRecCard();
 setRecStatus('');
 document.getElementById('recAudio').classList.add('hidden');
 showPage('page-record');
}
function renderRecCard(){
 var w = WORDS[recIndex];
 document.getElementById('recWord').textContent = (recIndex+1)+' / '+WORDS.length+'  '+w.en;
 document.getElementById('recZh').textContent = w.zh;
 document.getElementById('recSentence').textContent = '例句：' + w.sentence;
 document.getElementById('recProgress').style.width = ((recIndex+1)/WORDS.length*100)+'%';
}
function speakCurrent(){
 var w = WORDS[recIndex];
 speak(w.en + '. ' + w.sentence);
}
function recPrev(){ recIndex = (recIndex-1+WORDS.length)%WORDS.length; renderRecCard(); }
function recNext(){ recIndex = (recIndex+1)%WORDS.length; renderRecCard(); }
function setRecStatus(msg, cls){
 var el = document.getElementById('recStatus');
 el.textContent = msg; el.className = 'status' + (cls ? ' '+cls : '');
}
function startRecording(){
 if(!getName()){ alert('請先輸入姓名'); return; }
 if(!window.MediaRecorder){ alert('此手機瀏覽器不支援錄音，請改用 Chrome'); return; }
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
   audioStream = stream;
   audioChunks = [];
   var mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
   mediaRecorder = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
   mediaRecorder.ondataavailable = function(e){ if(e.data.size>0) audioChunks.push(e.data); };
   mediaRecorder.onstop = function(){ onRecStopped(); };
   mediaRecorder.start();
   isRecording = true;
   document.getElementById('btnRecStart').disabled = true;
   document.getElementById('btnRecStop').disabled = false;
   setRecStatus('● 錄音中…請朗讀單字＋例句，完成後按「停止並自動上傳」');
 }).catch(function(err){
   alert('無法使用麥克風：' + err.message);
 });
}
function stopRecording(){
 if(mediaRecorder && isRecording){
   mediaRecorder.stop();
   isRecording = false;
   if(audioStream){ audioStream.getTracks().forEach(function(t){ t.stop(); }); }
   document.getElementById('btnRecStart').disabled = false;
   document.getElementById('btnRecStop').disabled = true;
   setRecStatus('處理中…');
 }
}
function blobToBase64(blob){
 return new Promise(function(resolve,reject){
   var r = new FileReader();
   r.onloadend = function(){ resolve(r.result.split(',')[1] || ''); };
   r.onerror = reject;
   r.readAsDataURL(blob);
 });
}
function onRecStopped(){
 var type = (audioChunks[0] && audioChunks[0].type) || 'audio/webm';
 var blob = new Blob(audioChunks, {type: type});
 var url = URL.createObjectURL(blob);
 var audio = document.getElementById('recAudio');
 audio.src = url;
 audio.classList.remove('hidden');
 var w = WORDS[recIndex];
 setRecStatus('錄音完成，上傳中…請稍候');
 blobToBase64(blob).then(function(b64){
   var now = new Date();
   var fname = getName() + '_' + w.en + '_' + now.getTime() + '.webm';
   var payload = {
     type:'recording', name:getName(), topic:TOPIC,
     recordingSheet:REC_SHEET, driveFolder:DRIVE_FOLDER,
     word:w.en, filename:fname, mimeType:type, audioBase64:b64
   };
   return postJSON(payload);
 }).then(function(res){
   if(res && res.result==='success'){
     setRecStatus('✅ 上傳成功！可以按「下一個」繼續錄下一個單字。', 'ok');
   } else {
     setRecStatus('❌ 上傳失敗：' + JSON.stringify(res), 'err');
   }
 }).catch(function(err){
   setRecStatus('❌ 上傳失敗：' + err.message + '（請檢查網路，重按停止可重傳）', 'err');
 });
}
function postJSON(obj){
 if(!scriptURL){ return Promise.reject(new Error('尚未設定 scriptURL，請老師先填入後端網址')); }
 return fetch(scriptURL, {
   method:'POST',
   headers:{'Content-Type':'text/plain;charset=utf-8'},
   body: JSON.stringify(obj)
 }).then(function(r){ return r.json(); });
}

/* ---- 測驗 ---- */
var quizQs = [], quizIdx = 0, quizCorrect = 0, quizStart = 0, quizAnswers = [];
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function goQuiz(){
 if(!getName()){ alert('請先輸入姓名'); return; }
 quizQs = WORDS.map(function(w){
   var pool = WORDS.filter(function(x){ return x.en!==w.en; });
   shuffle(pool);
   var opts = shuffle([w.zh].concat(pool.slice(0,2).map(function(x){ return x.zh; })));
   return {en:w.en, ans:w.zh, opts:opts};
 });
 shuffle(quizQs);
 quizIdx = 0; quizCorrect = 0; quizAnswers = [];
 quizStart = Date.now();
 setQuizStatus('');
 renderQuiz();
 showPage('page-quiz');
}
function renderQuiz(){
 var body = document.getElementById('quizBody');
 document.getElementById('quizProgress').style.width = (quizIdx/quizQs.length*100)+'%';
 if(quizIdx >= quizQs.length){ finishQuiz(); return; }
 var q = quizQs[quizIdx];
 var html = '<div style="font-size:18px">第 '+(quizIdx+1)+' / '+quizQs.length+' 題</div>'
   + '<div class="word-en">'+q.en+'</div><div class="hint">選出正確的中文意思</div>';
 q.opts.forEach(function(op){
   html += '<button class="opt" data-op="'+op.replace(/"/g,'&quot;')+'">'+op+'</button>';
 });
 body.innerHTML = html;
 var btns = body.querySelectorAll('.opt');
 btns.forEach(function(b){
   b.onclick = function(){
     var picked = b.getAttribute('data-op');
     var ok = (picked === q.ans);
     quizAnswers.push({word:q.en, picked:picked, answer:q.ans, ok:ok});
     if(ok) quizCorrect++;
     btns.forEach(function(x){
       x.disabled = true;
       if(x.getAttribute('data-op')===q.ans) x.classList.add('correct');
     });
     if(!ok) b.classList.add('wrong');
     setTimeout(function(){ quizIdx++; renderQuiz(); }, 600);
   };
 });
}
function setQuizStatus(msg, cls){
 var el = document.getElementById('quizStatus');
 el.textContent = msg; el.className = 'status' + (cls ? ' '+cls : '');
}
function finishQuiz(){
 document.getElementById('quizProgress').style.width = '100%';
 var total = quizQs.length;
 var score = Math.round(quizCorrect/total*100);
 var secs = Math.round((Date.now()-quizStart)/1000);
 var body = document.getElementById('quizBody');
 body.innerHTML = '<div class="score">'+getName()+'：'+quizCorrect+' / '+total+' 題（'+score+' 分）</div>'
   + '<div style="text-align:center">成績上傳中…</div>';
 setQuizStatus('成績上傳中…請稍候');
 var payload = {
   type:'quiz', name:getName(), topic:TOPIC, quizSheet:QUIZ_SHEET,
   score:score, correct:quizCorrect, total:total, durationSec:secs, details:quizAnswers
 };
 postJSON(payload).then(function(res){
   if(res && res.result==='success'){
     setQuizStatus('✅ 成績已自動上傳（'+score+' 分）', 'ok');
     body.innerHTML = '<div class="score">'+getName()+'：'+quizCorrect+' / '+total+' 題（'+score+' 分）</div>'
       + '<div style="text-align:center" class="hint">已上傳給老師 ✅</div>'
       + '<button class="btn green" onclick="goQuiz()">再考一次</button>';
   } else {
     setQuizStatus('❌ 上傳失敗：'+JSON.stringify(res)+'，分數為 '+score+' 分，請截圖給老師', 'err');
   }
 }).catch(function(err){
   setQuizStatus('❌ 上傳失敗：'+err.message+'，你的分數是 '+score+' 分，請截圖給老師', 'err');
 });
}
</script>
</body>
</html>
